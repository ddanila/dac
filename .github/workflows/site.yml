name: Museum checks and Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: museum-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm
      - id: scope
        run: node scripts/ci-scope.mjs
        env:
          CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      - run: npm ci
      - run: DAC_BASE=/dac/ npm run build
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist
  checks:
    name: ${{ matrix.label }}
    needs: build
    env:
      DAC_CI_SHARD: ${{ matrix.shard }}
      DAC_CI_SCOPE: ${{ needs.build.outputs.scope }}
    strategy:
      # All browsers share one fail-fast group: a failure cancels sibling jobs.
      fail-fast: true
      matrix:
        include:
          - {label: chromium-1, browser: chromium, os: ubuntu-latest, shard: "1"}
          - {label: chromium-2, browser: chromium, os: ubuntu-latest, shard: "2"}
          - {label: firefox, browser: firefox, os: ubuntu-latest, shard: ""}
          - {label: webkit, browser: webkit, os: macos-latest, shard: ""}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.browser != 'chromium' && 10 || needs.build.outputs.scope == 'full' && 20 || 15 }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Use Ubuntu main mirror for browser dependencies
        if: runner.os == 'Linux'
        run: sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - id: core
        if: matrix.browser == 'chromium' && needs.build.outputs.scope == 'full'
        run: node -e "const fs=require('fs');fs.appendFileSync(process.env.GITHUB_OUTPUT,'ref='+require('./public/emulator/manifest.json').commit+'\n')"
      - uses: actions/checkout@v7
        if: matrix.browser == 'chromium' && needs.build.outputs.scope == 'full'
        with:
          repository: ddanila/dac-emulation
          ref: ${{ steps.core.outputs.ref }}
          path: emulation-reference
      - run: make -C emulation-reference build/dac-replay
        if: matrix.browser == 'chromium' && needs.build.outputs.scope == 'full'
      - name: Model and interaction checks
        if: matrix.browser == 'chromium' && needs.build.outputs.scope == 'visual'
        run: npx playwright test tests/assembly.spec.js tests/cable-geometry.spec.js tests/crt.spec.js tests/drive-levers.spec.js tests/drive-motion.spec.js tests/exhibit-improvements.spec.js tests/exploration.spec.js tests/fan.spec.js tests/inspection.spec.js tests/interior.spec.js tests/keyboard.spec.js tests/museum.spec.js tests/pcb-components.spec.js tests/sessions.spec.js --reporter=line
      - name: Full Chromium checks
        if: matrix.browser == 'chromium' && needs.build.outputs.scope == 'full'
        run: npm test -- --reporter=line
        env:
          DAC_NATIVE_REPLAY: emulation-reference/build/dac-replay
      - name: Cross-browser model checks
        if: matrix.browser != 'chromium' && needs.build.outputs.scope == 'visual'
        run: npm run test:cross -- --project=${{ matrix.browser }} tests/assembly.spec.js
      - name: Full cross-browser checks
        if: matrix.browser != 'chromium' && needs.build.outputs.scope == 'full'
        run: npm run test:cross -- --project=${{ matrix.browser }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: failures-${{ matrix.label }}
          path: test-results/
          retention-days: 3
  deploy:
    if: github.event_name != 'pull_request'
    needs: [build, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/deploy-pages@v5.0.1
        id: deploy
