name: Museum checks and Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: museum-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: DAC_BASE=/dac/ npm run build
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist
  chromium:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - id: core
        run: node -e "const fs=require('fs');fs.appendFileSync(process.env.GITHUB_OUTPUT,'ref='+require('./public/emulator/manifest.json').commit+'\n')"
      - uses: actions/checkout@v7
        with:
          repository: ddanila/dac-emulation
          ref: ${{ steps.core.outputs.ref }}
          path: emulation-reference
      - run: make -C emulation-reference build/dac-replay
      - run: npm test -- --shard=${{ matrix.shard }}/3
        env:
          DAC_NATIVE_REPLAY: emulation-reference/build/dac-replay
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: chromium-${{ matrix.shard }}-failures
          path: test-results/
          retention-days: 3
  cross-browser:
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: firefox
            os: ubuntu-latest
          - browser: webkit
            os: macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run test:cross -- --project=${{ matrix.browser }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: cross-browser-${{ matrix.browser }}-failures
          path: test-results/
          retention-days: 3
  deploy:
    if: github.event_name != 'pull_request'
    needs: [build, chromium, cross-browser]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/deploy-pages@v5.0.1
        id: deploy
