name: Museum checks and Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: museum-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
      test_files: ${{ steps.scope.outputs.test_files }}
      matrix: ${{ steps.scope.outputs.matrix }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm
      - id: scope
        run: node scripts/ci-scope.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Fetch and verify deployment photos
        run: node scripts/ci-photos.mjs --all
      - run: npm ci
      - name: Check CI scope and shard coverage
        run: npx playwright test tests/ci-shards.spec.js --workers=1
      - name: Check analyzer Python-oracle and production USB handler parity
        run: npm run test:analyzer && npm run test:analyzer:scale
      - name: Check test imports before installing browsers
        run: npx playwright test --list
      - name: Install browser for PSU references
        if: steps.scope.outputs.scope == 'reference'
        run: npx playwright install --with-deps chromium --only-shell
      - name: Check PSU references
        if: steps.scope.outputs.scope == 'reference'
        run: npx playwright test tests/psu-docs.spec.js --workers=1
      - run: DAC_BASE=/dac/ npm run build
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist
  checks:
    name: ${{ matrix.label }}
    needs: build
    if: needs.build.outputs.scope != 'docs' && needs.build.outputs.scope != 'reference'
    env:
      DAC_CI_SHARD: ${{ matrix.shard }}
      DAC_CI_TEST_FILES: ${{ needs.build.outputs.test_files }}
    strategy:
      # All browsers share one fail-fast group: a failure cancels sibling jobs.
      fail-fast: true
      matrix: ${{ fromJSON(needs.build.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.browser != 'chromium' && 10 || needs.build.outputs.scope == 'full' && 25 || 15 }}
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm
      - name: Fetch and verify runtime photos
        run: node scripts/ci-photos.mjs
      - run: npm ci
      - name: Use Ubuntu main mirror for browser dependencies
        if: runner.os == 'Linux'
        run: sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources
      - name: Install selected browser
        run: npx playwright install --with-deps ${{ matrix.browser }} ${{ matrix.browser == 'chromium' && '--only-shell' || '' }}
      - id: core
        if: matrix.native
        run: node -e "const fs=require('fs');fs.appendFileSync(process.env.GITHUB_OUTPUT,'ref='+require('./public/emulator/manifest.json').commit+'\n')"
      - uses: actions/checkout@v7
        if: matrix.native
        with:
          repository: ddanila/dac-emulation
          ref: ${{ steps.core.outputs.ref }}
          path: emulation-reference
      - run: make -C emulation-reference build/dac-replay
        if: matrix.native
      - name: Selected Chromium checks
        if: matrix.browser == 'chromium'
        run: npm test -- --reporter=line,./scripts/ci-timing-reporter.mjs
        env:
          DAC_CI_SCOPE: ${{ needs.build.outputs.scope }}
          DAC_NATIVE_REPLAY: ${{ matrix.native && 'emulation-reference/build/dac-replay' || '' }}
      - uses: actions/upload-artifact@v7
        if: always() && matrix.browser == 'chromium'
        with:
          name: timings-${{ matrix.label }}
          path: test-results/ci-timings.json
          if-no-files-found: error
          retention-days: 30
      - name: Selected cross-browser checks
        if: matrix.browser != 'chromium'
        run: npm run test:cross -- --project=${{ matrix.browser }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: failures-${{ matrix.label }}
          path: test-results/
          retention-days: 3
  deploy:
    if: >-
      !cancelled() && github.event_name != 'pull_request' &&
      needs.build.result == 'success' &&
      (needs.checks.result == 'success' ||
       (contains(fromJSON('["docs","reference"]'), needs.build.outputs.scope) && needs.checks.result == 'skipped'))
    needs: [build, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/deploy-pages@v5.0.1
        id: deploy
